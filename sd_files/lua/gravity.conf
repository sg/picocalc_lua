--[[

  gravity.conf - Initial state for 2D gravity simulation

  Settings:
    dt       - time step per tick (higher = faster simulation)
    G        - gravitational constant (tune for visual effect)
    soften   - softening distance to prevent infinite forces
    trail    - leave trails on screen (true/false)
    merge    - merge bodies on collision

  Body properties:
    name     - label displayed on screen
    mass     - gravitational mass (arbitrary units)
    x, y     - starting pixel position (center of circle)
    speed    - initial speed in pixels per tick
    dir      - initial direction in degrees (0=up, 90=right, 180=down, 270=left)
    color    - {r, g, b} values 0-255
    diameter - body diameter in pixels (default 5)
    fixed    - if true, body does not move (useful for anchored stars)

]]

return {
  dt = 0.5,
  G = 80.0,
  soften = 4.0,
  trail = false,
  merge = true,

  bodies = {
    { name = "Sun",     mass = 800, x = 160, y = 160, speed = 0,   dir = 0,   color = {255, 255, 0},   diameter = 15, fixed = true },
    { name = "Mercury", mass = 1,   x = 160, y = 120, speed = 3.8, dir = 90,  color = {180, 180, 180}, diameter = 3 },
    { name = "Venus",   mass = 2,   x = 160, y = 95,  speed = 3.2, dir = 90,  color = {255, 200, 100}, diameter = 5 },
    { name = "Earth",   mass = 3,   x = 160, y = 65,  speed = 2.8, dir = 90,  color = {0, 128, 255},   diameter = 5 },
    { name = "Mars",    mass = 1.5, x = 160, y = 35,  speed = 2.4, dir = 90,  color = {255, 80, 0},    diameter = 4 },
  },
}
