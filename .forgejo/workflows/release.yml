# Builds the firmware for every board plus the SD-card archive for a tag
# and stages them as a draft release to review and publish by hand.
# Runs when a tag such as v1.2.0 is pushed, or on demand for an existing tag.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build"
        required: true
        type: string
      prerelease:
        description: "Mark the draft as a pre-release"
        type: boolean
        default: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PRERELEASE: ${{ github.event.inputs.prerelease }}
  TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: docker
    container:
      # built on the runner's Docker host from picocalc-z80's ci/builder:
      # toolchain, Pico SDK and picotool included
      image: picocalc-builder:2.3.1
    steps:
      - name: Check out the tag
        run: |
          git config --global --add safe.directory '*'
          git clone --quiet --branch "$TAG" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" src
          git -C src log -1 --oneline

      - name: Build every board
        run: |
          export DEPLOY="$PWD/dist"
          cd src && ./build.sh all "$TAG"

      - name: Pack the SD-card files
        run: VERSION="$TAG" src/make-sd-archive.sh "dist/sd_files-$TAG.tar.gz"

      - name: Stage a draft release
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"

          if curl -sf -o /dev/null -H "$auth" "$api/releases/tags/$TAG"; then
            echo "A release for $TAG already exists; delete it or choose a new tag"
            exit 1
          fi

          (cd dist && sha256sum *.uf2 *.tar.gz > SHA256SUMS.txt)

          # the previous tag bounds the change list; the first release lists everything
          prev=$(git -C src describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "Changes since ${prev:-the first commit}:"
            echo
            git -C src log --format='- %s' "${prev:+$prev..}$TAG"
          } > notes.md

          body=$(python3 -c '
          import json, sys
          print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1],
                            "body": open(sys.argv[2]).read(), "draft": True,
                            "prerelease": sys.argv[3] == "true"}))' "$TAG" notes.md "$PRERELEASE")
          id=$(curl -sS --fail-with-body -H "$auth" -H "Content-Type: application/json" \
                 -d "$body" "$api/releases" \
               | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')

          for f in dist/*; do
            curl -sS --fail-with-body -o /dev/null -H "$auth" -F "attachment=@$f" \
              "$api/releases/$id/assets?name=$(basename "$f")"
            echo "uploaded $(basename "$f")"
          done
          echo "Draft release $TAG is waiting at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
